<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排队取号</title>
<script>
// 从服务器获取最新排号链接
fetch('https://participated-interest-suppose-forums.trycloudflare.com/current.json')
  .then(r => r.json())
  .then(d => {
    if (d.url) {
      window.location.href = d.url;
    } else {
      document.body.innerHTML = '<div style="text-align:center;padding:40px;font-family:sans-serif;color:#666">系统维护中，请稍后再试</div>';
    }
  })
  .catch(() => {
    document.body.innerHTML = '<div style="text-align:center;padding:40px;font-family:sans-serif;color:#666">网络连接失败，请检查网络</div>';
  });
</script>
</head>
<body style="background:#f5f5f5">
  <div style="text-align:center;padding:60px;font-family:sans-serif;color:#999">正在连接排号系统...</div>
</body>
</html>
